trigger: none

variables:
  - group: React-Native
  - name: ANDROID_SDK_PATH
    value: '/home/azureuser/android-sdk'
  - name: FIREBASE_PROJECT_ID
    value: 'react-native-1b396'
  - name: tag
    value: '$(Build.BuildId)'

# ======================================================
# STAGE 1: Build APKs
# ======================================================

stages:

- stage: BuildAPKs
  displayName: Build Android APKs

  jobs:

  # ─── Job 1: SampleApp ───────────────────────────────
  - job: BuildSampleApp
    displayName: Build SampleApp APK
    timeoutInMinutes: 120
    pool:
      name: Project-azure

    steps:

    - script: |
        if [ ! -d "$ANDROID_SDK_PATH/cmdline-tools/latest" ]; then
          echo "=== Android SDK not found, installing ==="
          mkdir -p $ANDROID_SDK_PATH/cmdline-tools
          cd $ANDROID_SDK_PATH/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          $ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
        else
          echo "=== Android SDK already installed, skipping ==="
        fi
        yes | $ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006"
        echo "##vso[task.setvariable variable=ANDROID_HOME]$ANDROID_SDK_PATH"
        echo "##vso[task.setvariable variable=ANDROID_SDK_ROOT]$ANDROID_SDK_PATH"
        ls $ANDROID_SDK_PATH/
      displayName: Install Android SDK

    - script: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        cat local.properties
      workingDirectory: '$(Build.SourcesDirectory)/examples/SampleApp/android'
      displayName: Write local.properties

    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
      displayName: Install Node.js

    - script: npm install -g yarn
      displayName: Install Yarn

    - task: Cache@2
      inputs:
        key: 'yarn | "$(Agent.OS)" | yarn.lock'
        restoreKeys: 'yarn | "$(Agent.OS)"'
        path: '$(Build.SourcesDirectory)/node_modules'
      displayName: Cache root node_modules

    - task: Cache@2
      inputs:
        key: 'yarn-sampleapp | "$(Agent.OS)" | examples/SampleApp/yarn.lock'
        restoreKeys: 'yarn-sampleapp | "$(Agent.OS)"'
        path: '$(Build.SourcesDirectory)/examples/SampleApp/node_modules'
      displayName: Cache SampleApp node_modules

    - task: Cache@2
      inputs:
        key: 'gradle-sampleapp | "$(Agent.OS)" | examples/SampleApp/android/app/build.gradle'
        restoreKeys: 'gradle-sampleapp | "$(Agent.OS)"'
        path: '$(HOME)/.gradle'
      displayName: Cache Gradle

    - script: yarn install --ignore-engines --network-timeout 300000 || true
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: Install dependencies (root)

    - script: |
        mkdir -p package/native-package/node_modules
        rm -f package/native-package/node_modules/mime
        cp -r node_modules/mime package/native-package/node_modules/mime 2>/dev/null || true
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: Fix mime symlink

    - script: yarn install --ignore-engines --network-timeout 300000
      workingDirectory: '$(Build.SourcesDirectory)/examples/SampleApp'
      displayName: Install dependencies (SampleApp)

    - script: |
        BASE_SRC="$(Build.SourcesDirectory)/package/native-package/android/src/main/java/com/streamchatreactnative"
        BASE_DEST="$(Build.SourcesDirectory)/examples/SampleApp/node_modules/stream-chat-react-native/android/src/main/java/com/streamchatreactnative"
        mkdir -p "$BASE_DEST/shared"
        cp -r "$BASE_SRC/shared/." "$BASE_DEST/shared/"
        cp "$BASE_SRC/StreamShimmerViewManager.kt" "$BASE_DEST/StreamShimmerViewManager.kt"
        ls -la "$BASE_DEST/"
        ls -la "$BASE_DEST/shared/"
      displayName: Copy shared native sources

    - script: |
        rm -f gradlew
        rm -rf gradle/wrapper
        mkdir -p gradle/wrapper
        curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew -o gradlew
        chmod +x gradlew
        curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties
      workingDirectory: '$(Build.SourcesDirectory)/examples/SampleApp/android'
      displayName: Create Gradle wrapper

    - script: |
        df -h /
        chmod +x gradlew
        ./gradlew assembleRelease \
          --build-cache \
          --parallel \
          --daemon \
          --no-configuration-cache \
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" \
          -Dorg.gradle.caching=true \
          -Dorg.gradle.workers.max=2 \
          -PreactNativeArchitectures=arm64-v8a
      workingDirectory: '$(Build.SourcesDirectory)/examples/SampleApp/android'
      displayName: Build APK (SampleApp)
      timeoutInMinutes: 90

    - script: find . -name "*.apk" 2>/dev/null || echo "No APK found"
      workingDirectory: '$(Build.SourcesDirectory)/examples/SampleApp/android'
      displayName: Verify APK

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)/examples/SampleApp/android/app/build/outputs/apk'
        ArtifactName: 'apk-sampleapp'
        publishLocation: 'Container'
      displayName: Publish APK

  # ─── Job 2: TypeScriptMessaging ─────────────────────
  - job: BuildTypeScriptMessaging
    displayName: Build TypeScriptMessaging APK
    timeoutInMinutes: 120
    pool:
      name: Project-azure

    steps:

    - script: |
        if [ ! -d "$ANDROID_SDK_PATH/cmdline-tools/latest" ]; then
          echo "=== Android SDK not found, installing ==="
          mkdir -p $ANDROID_SDK_PATH/cmdline-tools
          cd $ANDROID_SDK_PATH/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          $ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
        else
          echo "=== Android SDK already installed, skipping ==="
        fi
        yes | $ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "ndk;27.1.12297006"
        echo "##vso[task.setvariable variable=ANDROID_HOME]$ANDROID_SDK_PATH"
        echo "##vso[task.setvariable variable=ANDROID_SDK_ROOT]$ANDROID_SDK_PATH"
        ls $ANDROID_SDK_PATH/
      displayName: Install Android SDK

    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
      displayName: Install Node.js

    - script: npm install -g yarn
      displayName: Install Yarn

    - task: Cache@2
      inputs:
        key: 'yarn | "$(Agent.OS)" | yarn.lock'
        restoreKeys: 'yarn | "$(Agent.OS)"'
        path: '$(Build.SourcesDirectory)/node_modules'
      displayName: Cache root node_modules

    - task: Cache@2
      inputs:
        key: 'yarn-tsm | "$(Agent.OS)" | examples/TypeScriptMessaging/yarn.lock'
        restoreKeys: 'yarn-tsm | "$(Agent.OS)"'
        path: '$(Build.SourcesDirectory)/examples/TypeScriptMessaging/node_modules'
      displayName: Cache TypeScriptMessaging node_modules

    - task: Cache@2
      inputs:
        key: 'gradle-tsm | "$(Agent.OS)" | examples/TypeScriptMessaging/android/app/build.gradle'
        restoreKeys: 'gradle-tsm | "$(Agent.OS)"'
        path: '$(HOME)/.gradle'
      displayName: Cache Gradle

    - script: yarn install --ignore-engines --network-timeout 300000 || true
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: Install dependencies (root)

    - script: |
        mkdir -p package/native-package/node_modules
        rm -f package/native-package/node_modules/mime
        cp -r node_modules/mime package/native-package/node_modules/mime 2>/dev/null || true
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: Fix mime symlink

    - script: yarn install --ignore-engines --network-timeout 300000
      workingDirectory: '$(Build.SourcesDirectory)/examples/TypeScriptMessaging'
      displayName: Install dependencies (TypeScriptMessaging)

    - script: |
        yarn add \
          react-native-teleport \
          @shopify/flash-list \
          @react-native-camera-roll/camera-roll \
          @stream-io/flat-list-mvcp \
          react-native-nitro-modules \
          react-native-nitro-sound \
          react-native-fast-image \
          react-native-compressor \
          react-native-keyboard-controller \
          emoji-mart \
          @emoji-mart/data \
          --ignore-engines --network-timeout 300000 2>/dev/null || true
        for pkg in \
          react-native-teleport \
          @shopify/flash-list \
          @react-native-camera-roll/camera-roll \
          @stream-io/flat-list-mvcp \
          react-native-nitro-modules \
          react-native-nitro-sound \
          react-native-keyboard-controller \
          emoji-mart \
          @emoji-mart/data; do
          ls node_modules/$pkg > /dev/null 2>&1 && echo "$pkg OK" || echo "$pkg NOT FOUND"
        done
      workingDirectory: '$(Build.SourcesDirectory)/examples/TypeScriptMessaging'
      displayName: Install peer dependencies

    - script: |
        BASE_SRC="$(Build.SourcesDirectory)/package/native-package/android/src/main/java/com/streamchatreactnative"
        BASE_DEST="$(Build.SourcesDirectory)/examples/TypeScriptMessaging/node_modules/stream-chat-react-native/android/src/main/java/com/streamchatreactnative"
        mkdir -p "$BASE_DEST/shared"
        cp -r "$BASE_SRC/shared/." "$BASE_DEST/shared/"
        cp "$BASE_SRC/StreamShimmerViewManager.kt" "$BASE_DEST/StreamShimmerViewManager.kt"
        ls -la "$BASE_DEST/"
        ls -la "$BASE_DEST/shared/"
      displayName: Copy shared native sources

    - script: |
        $ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.31.5"
        ls $ANDROID_SDK_PATH/cmake/
        $ANDROID_SDK_PATH/cmake/3.31.5/bin/cmake --version
        echo "sdk.dir=$ANDROID_SDK_PATH" > local.properties
        echo "cmake.dir=$ANDROID_SDK_PATH/cmake/3.31.5" >> local.properties
        cat local.properties
      workingDirectory: '$(Build.SourcesDirectory)/examples/TypeScriptMessaging/android'
      displayName: Install CMake and write local.properties

    - script: |
        python3 -c "
        import re
        content = open('app/build.gradle').read()
        content = re.sub(r'\s*externalNativeBuild \{\s*cmake \{\s*version [^\}]*\}\s*\}', '', content)
        patched = content.replace(
            'ndkVersion rootProject.ext.ndkVersion',
            'ndkVersion \"26.1.10909125\"'
        )
        open('app/build.gradle', 'w').write(patched)
        idx = patched.find('android {')
        print(patched[idx:idx+300])
        "
      workingDirectory: '$(Build.SourcesDirectory)/examples/TypeScriptMessaging/android'
      displayName: Patch NDK version in app/build.gradle

    - script: |
        python3 -c "
        content = open('app/src/main/AndroidManifest.xml').read()
        patched = content.replace(
            'xmlns:android=\"http://schemas.android.com/apk/res/android\"',
            'xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"'
        )
        patched = patched.replace(
            'android:allowBackup=\"false\"',
            'android:allowBackup=\"false\"\n        tools:replace=\"android:allowBackup\"'
        )
        open('app/src/main/AndroidManifest.xml', 'w').write(patched)
        print(patched[:600])
        "
      workingDirectory: '$(Build.SourcesDirectory)/examples/TypeScriptMessaging/android'
      displayName: Fix AndroidManifest merge conflict

    - script: |
        rm -f gradlew
        rm -rf gradle/wrapper
        mkdir -p gradle/wrapper
        curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew -o gradlew
        chmod +x gradlew
        curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        python3 -c "
        props = 'distributionBase=GRADLE_USER_HOME\n'
        props += 'distributionPath=wrapper/dists\n'
        props += 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip\n'
        props += 'zipStoreBase=GRADLE_USER_HOME\n'
        props += 'zipStorePath=wrapper/dists\n'
        open('gradle/wrapper/gradle-wrapper.properties', 'w').write(props)
        "
      workingDirectory: '$(Build.SourcesDirectory)/examples/TypeScriptMessaging/android'
      displayName: Create Gradle wrapper

    - script: |
        chmod +x gradlew
        ./gradlew generateCodegenArtifactsFromSchema \
          --no-configuration-cache \
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" \
          -PreactNativeArchitectures=arm64-v8a 2>&1 | tail -20
        find . -path "*/codegen/jni" -type d 2>/dev/null | head -20
      workingDirectory: '$(Build.SourcesDirectory)/examples/TypeScriptMessaging/android'
      displayName: Run React Native Codegen

    - script: |
        df -h /
        chmod +x gradlew
        ./gradlew assembleRelease \
          --build-cache \
          --parallel \
          --daemon \
          --no-configuration-cache \
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" \
          -Dorg.gradle.caching=true \
          -Dorg.gradle.workers.max=2 \
          -PreactNativeArchitectures=arm64-v8a
      workingDirectory: '$(Build.SourcesDirectory)/examples/TypeScriptMessaging/android'
      displayName: Build APK (TypeScriptMessaging)
      timeoutInMinutes: 90

    - script: find . -name "*.apk" 2>/dev/null || echo "No APK found"
      workingDirectory: '$(Build.SourcesDirectory)/examples/TypeScriptMessaging/android'
      displayName: Verify APK

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)/examples/TypeScriptMessaging/android/app/build/outputs/apk'
        ArtifactName: 'apk-typescriptmessaging'
        publishLocation: 'Container'
      displayName: Publish APK


# ======================================================
# STAGE 2: Firebase Test Lab — SampleApp
# ======================================================

- stage: TestSampleApp
  displayName: Firebase Test Lab (SampleApp)
  dependsOn: BuildAPKs
  pool:
    name: Project-azure

  jobs:
  - job: FirebaseTestSampleApp
    displayName: Robo Test on Physical Device

    steps:

    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'apk-sampleapp'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: Download SampleApp APK

    - script: |
        if ! command -v gcloud &> /dev/null; then
          echo "=== Installing gcloud CLI ==="
          curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts
          source /home/azureuser/google-cloud-sdk/path.bash.inc
        fi
        gcloud --version
      displayName: Install gcloud CLI

    - script: |
        source /home/azureuser/google-cloud-sdk/path.bash.inc || true

        echo '$(Firebase)' > /tmp/gcloud-key.json
        gcloud auth activate-service-account --key-file=/tmp/gcloud-key.json
        gcloud config set project $(FIREBASE_PROJECT_ID)

        echo "=== Authenticated with Firebase project: $(FIREBASE_PROJECT_ID) ==="
      displayName: Authenticate with Firebase

    - script: |
        source /home/azureuser/google-cloud-sdk/path.bash.inc || true

        APK_PATH=$(find $(System.ArtifactsDirectory)/apk-sampleapp -name "*.apk" | head -1)
        echo "=== Running Robo Test on APK: $APK_PATH ==="

        gcloud firebase test android run \
          --type robo \
          --app "$APK_PATH" \
          --device model=redfin,version=30,locale=en,orientation=portrait \
          --robo-script $(Build.SourcesDirectory)/testing/robo_script.json \
          --timeout 3m \
          --project $(FIREBASE_PROJECT_ID)
      displayName: Run Robo Test (SampleApp)

    - script: rm -f /tmp/gcloud-key.json
      displayName: Cleanup credentials
      condition: always()


