# ======================================================
# STAGE 4: Upload APKs to Azure Blob Storage
# ======================================================

- stage: UploadAPKs
  displayName: Upload APKs to Azure Blob Storage
  dependsOn:
    - TestSampleApp
    - TestTypeScriptMessaging
  pool:
    name: Project-azure

  jobs:

  # ─── Job 1: Upload SampleApp APK ────────────────────
  - job: UploadSampleApp
    displayName: Upload SampleApp APK & Generate URL

    steps:

    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'apk-sampleapp'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: Download SampleApp APK

    - script: |
        if ! command -v az &> /dev/null; then
          echo "=== Installing Azure CLI ==="
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        fi
        az --version
      displayName: Install Azure CLI

    - script: |
        az login --service-principal \
          --username "$(AZURE_SP_APP_ID)" \
          --password "$(AZURE_SP_PASSWORD)" \
          --tenant  "$(AZURE_SP_TENANT_ID)"
        echo "=== Logged in to Azure ==="
      displayName: Authenticate to Azure

    - script: |
        APK_PATH=$(find $(System.ArtifactsDirectory)/apk-sampleapp -name "*.apk" | head -1)
        APK_FILENAME="sampleapp-$(Build.BuildId).apk"

        echo "=== Uploading $APK_PATH as $APK_FILENAME ==="

        # Upload using storage account key — works with public access disabled
        az storage blob upload \
          --account-name "$(AZURE_STORAGE_ACCOUNT)" \
          --container-name "$(AZURE_STORAGE_CONTAINER)" \
          --name "$APK_FILENAME" \
          --file "$APK_PATH" \
          --account-key "$(AZURE_STORAGE_KEY)" \
          --overwrite

        echo "=== Upload complete ==="

        # Generate SAS token using account key — produces a working pre-signed URL
        # even when public access is disabled on the storage account
        EXPIRY=$(date -u -d "+30 days" '+%Y-%m-%dT%H:%MZ')

        SAS_TOKEN=$(az storage blob generate-sas \
          --account-name "$(AZURE_STORAGE_ACCOUNT)" \
          --container-name "$(AZURE_STORAGE_CONTAINER)" \
          --name "$APK_FILENAME" \
          --permissions r \
          --expiry "$EXPIRY" \
          --account-key "$(AZURE_STORAGE_KEY)" \
          --output tsv)

        DOWNLOAD_URL="https://$(AZURE_STORAGE_ACCOUNT).blob.core.windows.net/$(AZURE_STORAGE_CONTAINER)/${APK_FILENAME}?${SAS_TOKEN}"

        echo "=============================================="
        echo "=== SampleApp APK Download URL (30 days) ==="
        echo "$DOWNLOAD_URL"
        echo "=============================================="

        echo "##vso[task.setvariable variable=SAMPLEAPP_APK_URL;isOutput=true]$DOWNLOAD_URL"
      displayName: Upload SampleApp APK & Print URL
      name: UploadSampleAppAPK

    - script: az logout || true
      displayName: Azure Logout
      condition: always()

  # ─── Job 2: Upload TypeScriptMessaging APK ──────────
  - job: UploadTypeScriptMessaging
    displayName: Upload TypeScriptMessaging APK & Generate URL

    steps:

    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'apk-typescriptmessaging'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: Download TypeScriptMessaging APK

    - script: |
        if ! command -v az &> /dev/null; then
          echo "=== Installing Azure CLI ==="
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        fi
        az --version
      displayName: Install Azure CLI

    - script: |
        az login --service-principal \
          --username "$(AZURE_SP_APP_ID)" \
          --password "$(AZURE_SP_PASSWORD)" \
          --tenant  "$(AZURE_SP_TENANT_ID)"
        echo "=== Logged in to Azure ==="
      displayName: Authenticate to Azure

    - script: |
        APK_PATH=$(find $(System.ArtifactsDirectory)/apk-typescriptmessaging -name "*.apk" | head -1)
        APK_FILENAME="typescriptmessaging-$(Build.BuildId).apk"

        echo "=== Uploading $APK_PATH as $APK_FILENAME ==="

        # Upload using storage account key — works with public access disabled
        az storage blob upload \
          --account-name "$(AZURE_STORAGE_ACCOUNT)" \
          --container-name "$(AZURE_STORAGE_CONTAINER)" \
          --name "$APK_FILENAME" \
          --file "$APK_PATH" \
          --account-key "$(AZURE_STORAGE_KEY)" \
          --overwrite

        echo "=== Upload complete ==="

        # Generate SAS token using account key — produces a working pre-signed URL
        # even when public access is disabled on the storage account
        EXPIRY=$(date -u -d "+30 days" '+%Y-%m-%dT%H:%MZ')

        SAS_TOKEN=$(az storage blob generate-sas \
          --account-name "$(AZURE_STORAGE_ACCOUNT)" \
          --container-name "$(AZURE_STORAGE_CONTAINER)" \
          --name "$APK_FILENAME" \
          --permissions r \
          --expiry "$EXPIRY" \
          --account-key "$(AZURE_STORAGE_KEY)" \
          --output tsv)

        DOWNLOAD_URL="https://$(AZURE_STORAGE_ACCOUNT).blob.core.windows.net/$(AZURE_STORAGE_CONTAINER)/${APK_FILENAME}?${SAS_TOKEN}"

        echo "================================================================="
        echo "=== TypeScriptMessaging APK Download URL (30 days) ==="
        echo "$DOWNLOAD_URL"
        echo "================================================================="

        echo "##vso[task.setvariable variable=TSM_APK_URL;isOutput=true]$DOWNLOAD_URL"
      displayName: Upload TypeScriptMessaging APK & Print URL
      name: UploadTSMAPK

    - script: az logout || true
      displayName: Azure Logout
      condition: always()